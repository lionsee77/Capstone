# Column mapping for `taxonomy-pipeline import-source` (see README.md). ESCO is
# split across linked files, so run `python flatten_esco.py` first: it joins them
# into raw/esco_flat.csv, one row per occupation-skill link. Paths are relative to this file.
name: esco
display_name: ESCO
source: raw/esco_flat.csv
columns:
  # ISCO-08 major group, from the unit group's first digit: 2654 -> 2 -> Professionals.
  category: {column: isco_group, prefix: 1, labels: isco_major_groups.csv}
  speciality: occupation             # e.g. technical director
  tag: skill                         # e.g. manage musical staff
  tag_description: skill_description # empty unless the export kept skills_en.csv's description column
# ISCO major groups are occupational functions, not industries (same as O*NET's
# SOC major groups), so every category goes under the baseline's "Function" service (id 2).
service_id: 2
table_prefix: esco_
