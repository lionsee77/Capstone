name: sql-files-nus

services:
  db:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: senseigigs-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-greygigz_beta}
      MYSQL_USER: ${MYSQL_USER:-senseigigs}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-localpassword}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-localrootpassword}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - senseigigs_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  adminer:
    image: adminer:4
    container_name: senseigigs-adminer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${ADMINER_PORT:-8080}:8080"

  inspector:
    build:
      context: .
      dockerfile: Dockerfile.python
    profiles: ["tools"]
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-greygigz_beta}
      MYSQL_USER: ${MYSQL_USER:-senseigigs}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-localpassword}
    depends_on:
      db:
        condition: service_healthy

volumes:
  senseigigs_mysql_data:
    name: senseigigs_mysql_data
