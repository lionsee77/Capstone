# Compare Ankit's original taxonomy against the generated SkillsFuture
# taxonomy. Paths are resolved relative to this file, not the working
# directory, so `taxonomy-pipeline run --config` works from anywhere.
datasets:
  - name: original
    type: sql_dump
    paths:
      - ../../sql-files-nus/services.sql
      - ../../sql-files-nus/categories.sql
      - ../../sql-files-nus/specialities.sql
      - ../../sql-files-nus/tags.sql
      - ../../sql-files-nus/speciality_tags.sql

  - name: skillsfuture
    type: sql_dump
    paths:
      - ../../skillsfuture/skillsfuture_taxonomy.sql
    table_map:
      categories: sf_categories
      specialities: sf_specialities
      tags: sf_tags
      speciality_tags: sf_speciality_tags

  - name: ssic
    type: ssic
    paths: [../../reference_data/ssic/ssic2025-classification-structure.xlsx]

  - name: ssoc
    type: ssoc
    paths: [../../reference_data/ssoc/ssoc2024-classification-structure.xlsx]

metrics:
  - id: integrity
    params:
      dataset: original
      fuzzy_threshold: 85

  - id: integrity
    params:
      dataset: skillsfuture
      fuzzy_threshold: 85

  - id: depth
    params:
      dataset: original

  - id: depth
    params:
      dataset: skillsfuture

  - id: breadth
    params:
      target: original
      ssic_reference: ssic
      ssoc_reference: ssoc
      matching_method: semantic
      semantic_threshold: 0.60  # provisional, uncalibrated cosine cutoff

  - id: breadth
    params:
      target: skillsfuture
      ssic_reference: ssic
      ssoc_reference: ssoc
      matching_method: semantic
      semantic_threshold: 0.60  # provisional, uncalibrated cosine cutoff

  - id: saturation
    params:
      baseline: original
      # Incoming sources are compared in order: each one against the baseline
      # plus every earlier source, giving one point on the new-items curve.
      # Declare another dataset above and append it, e.g. [skillsfuture, onet].
      incoming: [skillsfuture]
      # Exact matches (after folding case, '&'/'and' and plurals) are skipped.
      # A close spelling (RapidFuzz >= threshold) is only skipped when the
      # optional sentence model agrees (>= semantic_threshold); otherwise it
      # is REVIEW_AMBIGUOUS, so "evaluation" is never dropped as "valuation".
      threshold: 90
      semantic_model: all-MiniLM-L6-v2
      semantic_threshold: 0.70
      # SkillsFuture job roles are titles ("Risk Manager") while original
      # specialities are skills ("Risk Management"); low meaning scores between
      # them are mostly loose associations, so job roles need a stronger match.
      semantic_threshold_by_level:
        specialities: 0.80
      # ADD_CANDIDATE needs a low lexical score and, when the model is
      # installed, a low semantic score. Other non-matches are REVIEW_AMBIGUOUS.
      add_candidate_lexical_threshold: 60
      add_candidate_semantic_threshold: 0.50
      # Also look for a similar concept at the other levels (e.g. SkillsFuture
      # skills vs original specialities); the parent check still applies.
      # false = strict level-by-level comparison.
      cross_level: true
