# Compare Ankit's original taxonomy against the generated SkillsFuture
# taxonomy. Paths are resolved relative to this file, not the working
# directory, so `taxonomy-pipeline run --config` works from anywhere.
datasets:
  - name: original
    type: sql_dump
    paths:
      - ../../sql-files-nus/services.sql
      - ../../sql-files-nus/categories.sql
      - ../../sql-files-nus/specialities.sql
      - ../../sql-files-nus/tags.sql
      - ../../sql-files-nus/speciality_tags.sql

  - name: skillsfuture
    type: sql_dump
    paths:
      - ../../skillsfuture/skillsfuture_taxonomy.sql
    table_map:
      categories: sf_categories
      specialities: sf_specialities
      tags: sf_tags
      speciality_tags: sf_speciality_tags

  - name: ssic
    type: ssic
    paths: [../../reference_data/ssic/ssic2025-classification-structure.xlsx]

  - name: ssoc
    type: ssoc
    paths: [../../reference_data/ssoc/ssoc2024-classification-structure.xlsx]

metrics:
  - id: integrity
    params:
      dataset: original
      fuzzy_threshold: 85

  - id: integrity
    params:
      dataset: skillsfuture
      fuzzy_threshold: 85

  - id: depth
    params:
      dataset: original

  - id: depth
    params:
      dataset: skillsfuture

  - id: breadth
    params:
      target: original
      ssic_reference: ssic
      ssoc_reference: ssoc
      threshold: 75

  - id: breadth
    params:
      target: skillsfuture
      ssic_reference: ssic
      ssoc_reference: ssoc
      threshold: 75

  - id: saturation
    params:
      baseline: original
      incoming: skillsfuture
      # Names are compared with normalized exact matching first, then the
      # RapidFuzz lexical matcher. The optional local sentence model then
      # identifies semantic candidate equivalents among lexical non-matches.
      # All semantic results still require human review before adoption.
      threshold: 90
      semantic_model: all-MiniLM-L6-v2
      semantic_threshold: 0.70
