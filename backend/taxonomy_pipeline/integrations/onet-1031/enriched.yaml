# Generated by `taxonomy-pipeline integrate`. The snapshot's paths are relative to this file;
# reference and incoming datasets keep the absolute paths of the round's config.
# Score it with: taxonomy-pipeline run --config enriched.yaml
datasets:
- name: enriched
  type: sql_dump
  paths:
  - baseline/services.sql
  - baseline/categories.sql
  - baseline/specialities.sql
  - baseline/tags.sql
  - baseline/speciality_tags.sql
  - baseline/additions.sql
  - additions.sql
- name: onet
  paths:
  - ../../../onet/onet_taxonomy.sql
  table_map:
    categories: onet_categories
    specialities: onet_specialities
    tags: onet_tags
    speciality_tags: onet_speciality_tags
- name: ssic
  type: ssic
  paths:
  - ../../../reference_data/ssic/ssic2025-classification-structure.xlsx
- name: ssoc
  type: ssoc
  paths:
  - ../../../reference_data/ssoc/ssoc2024-classification-structure.xlsx
metrics:
- id: integrity
  params:
    dataset: enriched
    fuzzy_threshold: 85
- id: depth
  params:
    dataset: enriched
- id: breadth
  params:
    target: enriched
    ssic_reference: ssic
    ssoc_reference: ssoc
    matching_method: semantic
    semantic_threshold: 0.6
- id: saturation
  params:
    baseline: enriched
    incoming:
    - onet
    threshold: 90
    semantic_model: all-MiniLM-L6-v2
    semantic_threshold: 0.7
    semantic_threshold_by_level:
      specialities: 0.8
    add_candidate_lexical_threshold: 60
    add_candidate_semantic_threshold: 0.5
    cross_level: true
    judge:
      model: gpt-6-luna
      candidates: 5
      same_at_or_above: 0.8
      new_at_or_above: 0.8
      levels:
      - tags
      cache: judge_cache_onet.json
      workers: 8
