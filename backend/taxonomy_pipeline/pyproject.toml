[project]
name = "taxonomy-pipeline"
version = "0.1.0"
description = "Pluggable taxonomy quality validation pipeline (CLI + FastAPI) for the Senseigigs capstone"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "pydantic>=2.6,<3",
    "sqlmodel>=0.0.16,<1",
    "pyyaml>=6.0,<7",
    "rapidfuzz>=3.6,<4",
    "numpy>=1.26,<3",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "httpx>=0.27,<1",
    "ruff>=0.6,<1",
]

[project.scripts]
taxonomy-pipeline = "taxonomy_pipeline.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
